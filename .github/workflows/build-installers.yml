name: build-installers

# Build the Windows (.exe) and Debian (.deb) installers on their native runners.
# Trigger by pushing a version tag (v1.2.3) or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job is granted write, and only to
# attach files to a Release. A build job that cannot write cannot be talked
# into pushing anything.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------- #
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app + build tools
        run: pip install -e ".[build,test]"

      # pytesseract is a Python dependency and comes with the install above;
      # the binary it wraps does not, and without it 26 OCR tests skip. They
      # had never run on Windows anywhere — this job went green with the whole
      # OCR path unexecuted, which is exactly what MULTYCAPTURE_REQUIRE_OCR
      # exists to prevent on Linux.
      # choco exits 0 and the install directory is not guaranteed: appending a
      # guessed "C:\Program Files\Tesseract-OCR" to GITHUB_PATH passed on one
      # run and left nothing on PATH on the next, on the same commit — runner
      # images vary. So find the binary, fail here if it is absent rather than
      # three steps later, and prove it runs. GITHUB_PATH is needed regardless:
      # a step's own PATH is not inherited by the next one.
      # Not via chocolatey. community.chocolatey.org answers 499 to GitHub's
      # runner IPs when it is throttling CI traffic -- it failed the v0.2.0 tag
      # build and then three retries in a row, while answering 200 from a
      # developer machine at the same moment. choco also installed nothing and
      # returned quietly: PowerShell does not abort on a native command's exit
      # code, and GitHub's pwsh wrapper inspects only the last one.
      #
      # UB Mannheim is the Windows build the tesseract project itself points
      # at. Pinning the version and its hash makes the build reproducible and
      # means a substituted file fails here rather than being installed. To
      # move to a newer tesseract, change both lines together.
      - name: Install tesseract
        env:
          TESSERACT_URL: https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-5.4.0.20240606.exe
          TESSERACT_SHA256: c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9
        run: |
          $setup = "$env:RUNNER_TEMP\tesseract-setup.exe"
          Invoke-WebRequest -Uri $env:TESSERACT_URL -OutFile $setup -UseBasicParsing
          $got = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:TESSERACT_SHA256) {
            throw "tesseract installer hash mismatch: got $got, expected $($env:TESSERACT_SHA256)"
          }
          # NSIS silent install. The runner account is an administrator, so the
          # installer's elevation requirement is satisfied here -- unlike under
          # VBoxManage guestcontrol, which cannot answer a UAC prompt.
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait -NoNewWindow
          $roots = @("$env:ProgramFiles\Tesseract-OCR", "${env:ProgramFiles(x86)}\Tesseract-OCR")
          $exe = Get-ChildItem -Path $roots -Filter tesseract.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) { throw "installer ran but no tesseract.exe was produced" }
          echo $exe.DirectoryName >> $env:GITHUB_PATH
          & $exe.FullName --version

      # Windows is where the suite is most worth running and was least run:
      # QSettings lives in the registry here, not in a file, and the Documents
      # folder can be redirected into OneDrive. Both are isolated by
      # tests/conftest.py — which had only ever been exercised on Linux.
      # No xvfb: Qt runs offscreen and pynput needs no display on Windows.
      - name: Run tests
        # Same reason as the Linux job: make a lost tesseract go red instead of
        # quietly green. Note this guards the binary only — the OCR tests also
        # need a scalable font, and skip for its absence without tripping this.
        env:
          MULTYCAPTURE_REQUIRE_OCR: "1"
        run: python -m pytest

      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm packaging/multycapture.spec

      - name: Verify the frozen bundle
        run: dist\MultyCapture\MultyCapture.exe selftest

      # Same feed, same silent pass-through as the tesseract step above: a
      # failure here used to reappear as "iscc is not recognized" in Build
      # installer, which says nothing about the cause.
      - name: Install Inno Setup
        run: |
          $globs = @("$env:ProgramFiles\Inno Setup*", "${env:ProgramFiles(x86)}\Inno Setup*")
          $iscc = $null
          foreach ($attempt in 1..3) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem -Path $globs -Filter ISCC.exe -ErrorAction SilentlyContinue |
                    Select-Object -First 1
            if ($iscc) { break }
            Write-Host "::warning::Inno Setup install attempt $attempt produced nothing; retrying"
            Start-Sleep -Seconds 20
          }
          if (-not $iscc) { throw "ISCC.exe absent after 3 install attempts" }
          echo $iscc.DirectoryName >> $env:GITHUB_PATH
          # Reporting the path, not running it: ISCC exits non-zero when given
          # no .iss, and a trailing non-zero exit code fails the whole step.
          Write-Host "found $($iscc.FullName)"

      - name: Derive version
        id: ver
        shell: bash
        run: bash .github/derive-version.sh

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\windows\multycapture.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/windows/Output/*.exe

  # --------------------------------------------------------------------- #
  linux:
    runs-on: ubuntu-latest
    # Build inside Debian 11 (glibc 2.31). PyInstaller bundles the glibc-linked
    # libraries it finds on the build host, so a bundle frozen on ubuntu-latest
    # (glibc 2.39) dies on any older distro with:
    #   libm.so.6: version `GLIBC_2.38' not found
    # glibc is backward- but not forward-compatible, so building on the OLDEST
    # distro we support makes the bundle run on that one and everything newer.
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4

      # The bullseye container is minimal, unlike the ubuntu-latest image which
      # ships most of these preinstalled. PyInstaller only bundles libraries it
      # can actually resolve at freeze time, so anything missing here is
      # silently dropped from the bundle and fails at runtime instead.
      - name: Install system libs for Qt (xcb)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev xvfb xauth \
            tesseract-ocr fonts-dejavu-core \
            libxcb1 libxcb-cursor0 libxcb-shape0 libxcb-randr0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-shm0 libxcb-xkb1 libx11-xcb1 \
            libxkbcommon-x11-0 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgdk-pixbuf2.0-0 \
            libcairo2 libpango-1.0-0

      - name: Install app + build tools
        run: pip install -e ".[build,test]"

      # xvfb gives pynput's X11 backend a display to import against; Qt itself
      # runs offscreen. Tests come before the freeze so a failure is reported
      # against the source rather than a 60 MB bundle.
      - name: Run tests
        # The OCR tests skip themselves when tesseract is missing, which would
        # keep this job green if the package ever fell out of the install above.
        env:
          MULTYCAPTURE_REQUIRE_OCR: "1"
        run: xvfb-run -a python -m pytest

      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm packaging/multycapture.spec

      - name: Verify the frozen bundle (headless)
        env:
          QT_QPA_PLATFORM: offscreen   # Qt needs no real display
        # xvfb provides a DISPLAY so pynput's X11 backend can import.
        run: xvfb-run -a ./dist/MultyCapture/MultyCapture selftest

      - name: Derive version
        id: ver
        run: bash .github/derive-version.sh

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: amd64
        run: bash installer/debian/build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: installer/debian/out/*.deb

  # --------------------------------------------------------------------- #
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that needs it: attaching files to a Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release with installers
        uses: softprops/action-gh-release@v2
        with:
          # Without this a glob that matches nothing publishes a release with
          # the file silently missing — and a release page offering Windows and
          # Linux with only one of them on it is worse than a failed build.
          fail_on_unmatched_files: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/debian-package/*.deb
          body: |
            Install the `.exe` on Windows, or the `.deb` on Debian/Ubuntu:

            ```
            sudo dpkg -i multycapture_*_amd64.deb
            ```

            **[User Guide](https://github.com/OmniaSolutions/MultyCapture/blob/main/docs/USER_GUIDE.md)** —
            where your files go, what is optional, and the AI features.

            Windows 10/11 and Linux under **Xorg**. Wayland cannot let one
            application watch another's windows, so MultyCapture detects it and
            refuses to start rather than recording something useless. macOS is
            not supported.

            Two optional extras: `tesseract-ocr` makes each step name what was
            clicked, and an AI backend can improve the wording — off by default,
            and nothing to install for it.
