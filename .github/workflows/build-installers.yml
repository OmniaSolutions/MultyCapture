name: build-installers

# Build the Windows (.exe) and Debian (.deb) installers on their native runners.
# Trigger by pushing a version tag (v1.2.3) or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach installers to a Release

jobs:
  # --------------------------------------------------------------------- #
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app + build tools
        run: pip install -e ".[build]"

      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm packaging/multycapture.spec

      - name: Verify the frozen bundle
        run: dist\MultyCapture\MultyCapture.exe selftest

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Derive version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.version || '0.1.0' }} installer\windows\multycapture.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/windows/Output/*.exe

  # --------------------------------------------------------------------- #
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs for Qt (xcb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev libxcb1 libxcb-cursor0 libxkbcommon-x11-0 libegl1 \
            libglib2.0-0 libfontconfig1 libdbus-1-3 xvfb

      - name: Install app + build tools
        run: pip install -e ".[build]"

      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm packaging/multycapture.spec

      - name: Verify the frozen bundle (headless)
        env:
          QT_QPA_PLATFORM: offscreen   # Qt needs no real display
        # xvfb provides a DISPLAY so pynput's X11 backend can import.
        run: xvfb-run -a ./dist/MultyCapture/MultyCapture selftest

      - name: Derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version || '0.1.0' }}
          ARCH: amd64
        run: bash installer/debian/build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: installer/debian/out/*.deb

  # --------------------------------------------------------------------- #
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/*.exe
            artifacts/debian-package/*.deb
