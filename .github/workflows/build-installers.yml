name: build-installers

# Build the Windows (.exe) and Debian (.deb) installers on their native runners.
# Trigger by pushing a version tag (v1.2.3) or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach installers to a Release

jobs:
  # --------------------------------------------------------------------- #
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app + build tools
        run: pip install -e ".[build]"

      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm packaging/multycapture.spec

      - name: Verify the frozen bundle
        run: dist\MultyCapture\MultyCapture.exe selftest

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Derive version
        id: ver
        shell: bash
        run: bash .github/derive-version.sh

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\windows\multycapture.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/windows/Output/*.exe

  # --------------------------------------------------------------------- #
  linux:
    runs-on: ubuntu-latest
    # Build inside Debian 11 (glibc 2.31). PyInstaller bundles the glibc-linked
    # libraries it finds on the build host, so a bundle frozen on ubuntu-latest
    # (glibc 2.39) dies on any older distro with:
    #   libm.so.6: version `GLIBC_2.38' not found
    # glibc is backward- but not forward-compatible, so building on the OLDEST
    # distro we support makes the bundle run on that one and everything newer.
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4

      # The bullseye container is minimal, unlike the ubuntu-latest image which
      # ships most of these preinstalled. PyInstaller only bundles libraries it
      # can actually resolve at freeze time, so anything missing here is
      # silently dropped from the bundle and fails at runtime instead.
      - name: Install system libs for Qt (xcb)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            dpkg-dev xvfb xauth \
            tesseract-ocr fonts-dejavu-core \
            libxcb1 libxcb-cursor0 libxcb-shape0 libxcb-randr0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-shm0 libxcb-xkb1 libx11-xcb1 \
            libxkbcommon-x11-0 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgdk-pixbuf2.0-0 \
            libcairo2 libpango-1.0-0

      - name: Install app + build tools
        run: pip install -e ".[build,test]"

      # xvfb gives pynput's X11 backend a display to import against; Qt itself
      # runs offscreen. Tests come before the freeze so a failure is reported
      # against the source rather than a 60 MB bundle.
      - name: Run tests
        # The OCR tests skip themselves when tesseract is missing, which would
        # keep this job green if the package ever fell out of the install above.
        env:
          MULTYCAPTURE_REQUIRE_OCR: "1"
        run: xvfb-run -a python -m pytest

      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm packaging/multycapture.spec

      - name: Verify the frozen bundle (headless)
        env:
          QT_QPA_PLATFORM: offscreen   # Qt needs no real display
        # xvfb provides a DISPLAY so pynput's X11 backend can import.
        run: xvfb-run -a ./dist/MultyCapture/MultyCapture selftest

      - name: Derive version
        id: ver
        run: bash .github/derive-version.sh

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: amd64
        run: bash installer/debian/build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: installer/debian/out/*.deb

  # --------------------------------------------------------------------- #
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/*.exe
            artifacts/debian-package/*.deb
