<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MultyCapture">
  <title>MultyCapture</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F8DF7"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect width="256" height="256" rx="58" fill="url(#tile)"/>

  <!-- camera body, with the viewfinder bump on the left as on a real body -->
  <path d="M98 60h44l14 28h40a24 24 0 0 1 24 24v72a24 24 0 0 1-24 24H60a24 24 0 0 1-24-24v-72a24 24 0 0 1 24-24h24z" fill="#fff"/>

  <!-- lens: the "film" is a document -->
  <circle cx="128" cy="148" r="48" fill="#1E3A8A"/>
  <circle cx="128" cy="148" r="35" fill="#fff"/>
  <g fill="#2563EB">
    <rect x="107" y="136" width="42" height="10" rx="5"/>
    <rect x="107" y="153" width="28" height="10" rx="5"/>
  </g>

  <!-- record indicator -->
  <circle cx="196" cy="115" r="12" fill="#EF4444"/>
</svg>
