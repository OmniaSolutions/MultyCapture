[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multycapture"
# Read from src/multycapture/_version.py rather than repeated here: a second
# copy is a copy that can disagree, and this one did — the .deb said 0.1.10
# while the application inside it stamped 0.1.2 into every session.json.
dynamic = ["version"]
description ="Fast-track screencasts into step-by-step documentation by capturing every click and keystroke."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=9.0",
    "pynput>=1.7",
    "Pillow>=10.0",
    "python-docx>=1.1",
    "platformdirs>=4.0",
    # Thin wrapper; the tesseract binary itself is optional at runtime and the
    # app degrades to no click labels without it (see multycapture.ocr).
    "pytesseract>=0.3",
    "PySide6-Essentials>=6.6",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "ewmh>=0.1.6 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8"]
# The AI backends need no client libraries — each is one JSON POST over the
# standard library — so there is nothing to install for them. This extra buys
# key storage in the OS keyring instead of a private file; see ai.credentials.
keyring = ["keyring>=24"]

[project.scripts]
mc = "multycapture.cli:main"

[project.gui-scripts]
mc-tray = "multycapture.gui.tray:main"

[tool.setuptools.dynamic]
# Read straight from the file that holds only the string, so setuptools can
# take it statically without importing the package.
version = {attr = "multycapture._version.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The GUI tests need a display for pynput's X11 backend to import; Qt itself
# runs offscreen (see tests/conftest.py). Run them under xvfb-run on Linux.
addopts = "-q"
