[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multycapture"
version = "0.1.2"
description = "Fast-track screencasts into step-by-step documentation by capturing every click and keystroke."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=9.0",
    "pynput>=1.7",
    "Pillow>=10.0",
    "python-docx>=1.1",
    "platformdirs>=4.0",
    # Thin wrapper; the tesseract binary itself is optional at runtime and the
    # app degrades to no click labels without it (see multycapture.ocr).
    "pytesseract>=0.3",
    "PySide6-Essentials>=6.6",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "ewmh>=0.1.6 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8"]

[project.scripts]
mc = "multycapture.cli:main"

[project.gui-scripts]
mc-tray = "multycapture.gui.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The GUI tests need a display for pynput's X11 backend to import; Qt itself
# runs offscreen (see tests/conftest.py). Run them under xvfb-run on Linux.
addopts = "-q"
