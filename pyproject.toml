[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multycapture"
version = "0.1.1"
description = "Fast-track screencasts into step-by-step documentation by capturing every click and keystroke."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=9.0",
    "pynput>=1.7",
    "Pillow>=10.0",
    "python-docx>=1.1",
    "PySide6-Essentials>=6.6",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "ewmh>=0.1.6 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
mc = "multycapture.cli:main"

[project.gui-scripts]
mc-tray = "multycapture.gui.tray:main"

[tool.setuptools.packages.find]
where = ["src"]
